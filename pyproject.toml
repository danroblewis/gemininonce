[project]
name = "gemininonce"
version = "0.1.0"
description = "Tiny fix-and-test loop driving Gemini web via browser automation"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40"]

[project.scripts]
gemininonce = "gemininonce:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gemininonce"]
